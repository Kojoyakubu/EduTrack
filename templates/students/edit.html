{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block page_title %}Edit Student{% endblock %}

{% block content %}
<div class="page-header">
  <h2 class="page-heading">Edit — {{ student.full_name }}</h2>
  <a href="{{ url_for('students.detail', student_id=student.id) }}" class="btn btn-outline">
    <i class="fas fa-arrow-left"></i> Back
  </a>
</div>

<div class="card" style="max-width: 720px;">
  <div class="card-header"><h3><i class="fas fa-edit"></i> Student Information</h3></div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('students.edit', student_id=student.id) }}">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" name="full_name" class="form-control" value="{{ student.full_name }}" required />
        </div>
        <div class="form-group">
          <label>Gender <span class="required">*</span></label>
          <select name="gender" class="form-control" required>
            <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Class <span class="required">*</span></label>
          <select name="class_id" class="form-control" required>
            {% for cls in classes %}
              <option value="{{ cls.id }}" {% if cls.id == student.class_id %}selected{% endif %}>{{ cls.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" name="date_of_birth" class="form-control"
                 value="{{ student.date_of_birth.isoformat() if student.date_of_birth else '' }}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>RFID Tag</label>
          <input type="text" name="rfid_tag" class="form-control" value="{{ student.rfid_tag or '' }}" />
        </div>
        <div class="form-group">
          <label>Biometric Credential</label>
          <input type="text" name="biometric_id" class="form-control" value="{{ student.biometric_id or '' }}" />
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address" class="form-control" rows="2">{{ student.address or '' }}</textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
        <a href="{{ url_for('students.detail', student_id=student.id) }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
