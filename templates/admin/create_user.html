{% extends "base.html" %}
{% block title %}Add User{% endblock %}
{% block page_title %}Add User{% endblock %}

{% block content %}
<div class="page-header">
  <h2 class="page-heading">Create New User</h2>
  <a href="{{ url_for('admin.users') }}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="card" style="max-width:520px;">
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" name="full_name" class="form-control" required />
      </div>
      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" name="email" class="form-control" required />
      </div>
      <div class="form-group">
        <label>Role <span class="required">*</span></label>
        <select name="role" class="form-control">
          <option value="staff">Staff</option>
          <option value="admin">Administrator</option>
        </select>
      </div>
      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <input type="password" name="password" class="form-control" minlength="8" required />
        <small class="text-muted">Minimum 8 characters</small>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create User</button>
        <a href="{{ url_for('admin.users') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
